<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Igreja Aberta — Escala</title>
    <meta name="description" content="Escala automática dos irmãos que abrem a igreja." />
    <meta name="theme-color" content="#c4b09b" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Igreja Aberta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- Tela de abertura. O SVG vai embutido para aparecer na hora, sem esperar
         nenhum arquivo extra carregar. -->
    <div id="abertura" class="abertura">
      <div class="abertura__marca">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Igreja Aberta — IECC">
          <title>Igreja Aberta — IECC</title>
          <defs>
            <path id="arcoTexto" d="M 24 118 A 96 96 0 0 1 216 118" fill="none" />
          </defs>
          <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M56 250 V150 A64 64 0 0 1 184 150 V250" />
            <circle cx="120" cy="150" r="18" />
            <g stroke-width="2.2">
              <path d="M94 146 L80 144" />
              <path d="M97 138 L83 131" />
              <path d="M102 132 L91 121" />
              <path d="M108 127 L101 113" />
              <path d="M116 124 L114 110" />
              <path d="M124 124 L126 110" />
              <path d="M132 127 L139 113" />
              <path d="M138 132 L149 121" />
              <path d="M143 138 L157 131" />
              <path d="M146 146 L160 144" />
            </g>
            <path d="M120 122 V250" />
            <path d="M86 158 H154" />
            <path d="M56 236 C 74 196 104 192 122 236" />
            <path d="M56 250 C 80 214 108 212 132 250" />
            <path d="M152 250 C 136 224 138 190 154 172 C 170 190 172 224 156 250" />
            <path d="M154 250 V186" />
            <path d="M52 258 C 78 248 104 250 120 260 C 136 250 162 248 188 258" />
            <path d="M52 258 V268 C 78 258 104 260 120 270 C 136 260 162 258 188 268 V258" />
            <path d="M120 260 V270" />
          </g>
          <g fill="currentColor" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', system-ui, sans-serif">
            <text font-size="27" letter-spacing="1.5">
              <textPath href="#arcoTexto" startOffset="50%">Igreja Aberta</textPath>
            </text>
            <text x="120" y="292" font-size="18" letter-spacing="7">IECC</text>
          </g>
        </svg>
      </div>
    </div>

    <header id="cabecalho" class="cabecalho oculto">
      <div class="cabecalho__topo">
        <div>
          <p class="cabecalho__olho">Igreja Aberta · IECC</p>
          <h1 id="tituloTela" class="cabecalho__titulo">Escala</h1>
        </div>
        <button id="botaoPerfil" class="avatar" type="button" title="Meu perfil">?</button>
      </div>
      <div id="faixaAviso" class="faixa oculto"></div>
    </header>

    <main id="view" class="view"></main>

    <nav id="navegacao" class="nav oculto">
      <button class="nav__item" data-rota="escala" type="button">
        <span class="nav__icone">🗓️</span><span>Escala</span>
      </button>
      <button class="nav__item" data-rota="disponibilidade" type="button">
        <span class="nav__icone">🚫</span><span>Não posso</span>
      </button>
      <button class="nav__item somente-admin" data-rota="gerar" type="button">
        <span class="nav__icone">✨</span><span>Gerar</span>
      </button>
      <button class="nav__item somente-admin" data-rota="irmaos" type="button">
        <span class="nav__icone">👥</span><span>Irmãos</span>
      </button>
      <button class="nav__item" data-rota="ajustes" type="button">
        <span class="nav__icone">⚙️</span><span>Ajustes</span>
      </button>
    </nav>

    <div id="barraAtualizacao" class="barra-atualizacao oculto">
      <span class="barra-atualizacao__texto">
        ✨ <strong>Nova versão disponível</strong><br />
        Toque para atualizar o app.
      </span>
      <button id="botaoAtualizar" class="barra-atualizacao__botao" type="button">Atualizar</button>
    </div>

    <div id="avisos" class="avisos" aria-live="polite"></div>
    <div id="modal" class="modal oculto"><div id="modalCaixa" class="modal__caixa"></div></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
